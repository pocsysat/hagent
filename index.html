<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef2ff;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --success: #10b981;
    --border: #e5e7eb;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    padding: 24px 24px 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  header h1 span { color: var(--accent); }
  .count-pill {
    font-size: .8rem;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ---------- input row ---------- */
  .input-row {
    display: flex;
    gap: 8px;
    padding: 0 24px 16px;
  }
  .input-row input {
    flex: 1;
    font: inherit;
    font-size: .95rem;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .input-row button {
    font: inherit;
    font-size: .95rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .input-row button:hover { background: var(--accent-hover); }
  .input-row button:active { transform: scale(.97); }

  /* ---------- filters ---------- */
  .filters {
    display: flex;
    gap: 6px;
    padding: 0 24px 12px;
  }
  .filters button {
    font: inherit;
    font-size: .8rem;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .filters button:hover { background: var(--bg); }
  .filters button.active {
    color: var(--accent);
    background: var(--accent-soft);
    font-weight: 600;
  }

  /* ---------- list ---------- */
  ul.todo-list {
    list-style: none;
    padding: 0 12px;
    flex: 1;
    min-height: 80px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    transition: background .15s;
    animation: slide-in .18s ease;
  }
  .todo-item:hover { background: var(--bg); }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  /* custom checkbox */
  .check {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all .15s;
  }
  .check svg {
    width: 13px; height: 13px;
    stroke: #fff; stroke-width: 3;
    fill: none;
    opacity: 0;
    transform: scale(.5);
    transition: all .15s;
  }
  .todo-item.done .check {
    background: var(--success);
    border-color: var(--success);
  }
  .todo-item.done .check svg { opacity: 1; transform: scale(1); }

  .todo-label {
    flex: 1;
    font-size: .95rem;
    line-height: 1.4;
    word-break: break-word;
    transition: color .15s;
  }
  .todo-item.done .todo-label {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .del {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    opacity: 0;
    transition: all .15s;
  }
  .todo-item:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: var(--danger-soft); color: var(--danger); }

  /* empty state */
  .empty {
    text-align: center;
    padding: 40px 24px;
    color: var(--text-muted);
  }
  .empty .icon { font-size: 2rem; margin-bottom: 8px; }
  .empty p { font-size: .9rem; }

  /* ---------- footer ---------- */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    background: #fafafa;
    font-size: .82rem;
    color: var(--text-muted);
  }
  .clear-done {
    font: inherit;
    font-size: .82rem;
    font-weight: 500;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all .15s;
  }
  .clear-done:hover { color: var(--danger); background: var(--danger-soft); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a20;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --accent-soft: #1e2140;
      --danger-soft: #2a1518;
      --border: #2b2f38;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    }
    footer { background: #14171c; }
  }
</style>
</head>
<body>
<main class="app" aria-label="Todo list">
  <header>
    <h1>Todo<span> List</span></h1>
    <div class="count-pill" id="countPill" aria-live="polite">0 tasks</div>
  </header>

  <form class="input-row" id="addForm">
    <input type="text" id="todoInput" placeholder="加入新待辦事項…"
           autocomplete="off" autofocus aria-label="新待辦事項">
    <button type="submit">加入</button>
  </form>

  <nav class="filters" role="tablist" aria-label="篩選">
    <button type="button" data-filter="all" class="active">全部</button>
    <button type="button" data-filter="active">未完成</button>
    <button type="button" data-filter="done">已完成</button>
  </nav>

  <ul class="todo-list" id="todoList" aria-label="待辦事項列表"></ul>

  <footer>
    <span id="remainInfo">剩餘 0 項</span>
    <button type="button" class="clear-done" id="clearDone">清除已完成</button>
  </footer>
</main>

<script>
(() => {
  "use strict";
  const STORAGE_KEY = "todo-app-items";

  /** @typedef {{id:string, text:string, done:boolean}} Todo */
  /** @type {Todo[]} */
  let todos = load();
  let filter = "all";

  const listEl   = document.getElementById("todoList");
  const formEl   = document.getElementById("addForm");
  const inputEl  = document.getElementById("todoInput");
  const pillEl   = document.getElementById("countPill");
  const remainEl = document.getElementById("remainInfo");
  const clearEl  = document.getElementById("clearDone");
  const filterBtns = document.querySelectorAll(".filters button");

  // ---------- storage ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed)
        ? parsed.filter(t => t && typeof t.text === "string" && "id" in t)
        : [];
    } catch { return []; }
  }
  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  // ---------- rendering ----------
  function render() {
    const visible = todos.filter(t =>
      filter === "all" ? true : filter === "active" ? !t.done : t.done);

    listEl.innerHTML = "";

    if (visible.length === 0) {
      const div = document.createElement("div");
      div.className = "empty";
      const msg = filter === "done" ? "還沒有已完成事項"
                : filter === "active" ? "全部完成了，做得好！🎉"
                : "清單是空的，加入第一件事開始吧";
      div.innerHTML = `<div class="icon">${filter === "active" ? "🎉" : "📝"}</div><p>${msg}</p>`;
      listEl.appendChild(div);
    } else {
      for (const t of visible) listEl.appendChild(itemNode(t));
    }

    const doneCount = todos.filter(t => t.done).length;
    const remain = todos.length - doneCount;
    pillEl.textContent = `${todos.length} task${todos.length === 1 ? "" : "s"}` +
                         (doneCount ? ` · ${doneCount} 完成` : "");
    remainEl.textContent = `剩餘 ${remain} 項`;
    clearEl.style.visibility = doneCount ? "visible" : "hidden";
  }

  function itemNode(t) {
    const li = document.createElement("li");
    li.className = "todo-item" + (t.done ? " done" : "");
    li.dataset.id = t.id;

    const check = document.createElement("button");
    check.className = "check";
    check.setAttribute("role", "checkbox");
    check.setAttribute("aria-checked", String(t.done));
    check.setAttribute("aria-label", t.done ? "標記為未完成" : "標記為已完成");
    check.innerHTML = '<svg viewBox="0 0 16 16"><path d="M2.5 8.5 L6 12 L13.5 4.5"/></svg>';
    check.addEventListener("click", () => toggle(t.id));

    const label = document.createElement("span");
    label.className = "todo-label";
    label.textContent = t.text;

    const del = document.createElement("button");
    del.className = "del";
    del.setAttribute("aria-label", `刪除：${t.text}`);
    del.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4 L12 12 M12 4 L4 12"/></svg>';
    del.addEventListener("click", () => remove(t.id));

    li.append(check, label, del);
    return li;
  }

  // ---------- actions ----------
  function add(text) {
    todos.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
                 text, done: false });
    persist();
    render();
  }
  function toggle(id) {
    const t = todos.find(x => x.id === id);
    if (t) { t.done = !t.done; persist(); render(); }
  }
  function remove(id) {
    todos = todos.filter(x => x.id !== id);
    persist();
    render();
  }
  function clearDone() {
    todos = todos.filter(t => !t.done);
    persist();
    render();
  }

  // ---------- events ----------
  formEl.addEventListener("submit", e => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    add(text);
    inputEl.value = "";
    inputEl.focus();
  });

  clearEl.addEventListener("click", clearDone);

  filterBtns.forEach(btn => btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    filterBtns.forEach(b => b.classList.toggle("active", b === btn));
    render();
  }));

  render(); // initial paint on load
})();
</script>
</body>
</html>
